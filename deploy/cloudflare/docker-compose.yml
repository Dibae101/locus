# Locus Hub behind Cloudflare on locus.dibyadarshankhanal.com.np
#
# Two ways to expose it (pick one — see deploy/cloudflare/README.md):
#   A) Public VM:        run this stack, point an A record at the VM IP, TLS via Cloudflare.
#   B) Cloudflare Tunnel: run this stack + the `cloudflared` service (no public IP needed).
#
# Start (Tunnel route):
#   TUNNEL_TOKEN=<token-from-cloudflare> \
#   docker compose -f deploy/cloudflare/docker-compose.yml --profile tunnel up -d
#
# Then seed the catalog:
#   LOCUS_REGISTRY=localhost:5000 LOCUS_INSECURE=1 locus catalog seed

services:
  registry:
    image: registry:2
    container_name: locus-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - locus-registry-data:/var/lib/registry
    restart: unless-stopped

  hub-ui:
    image: python:3.12-slim
    container_name: locus-hub-ui
    depends_on:
      - registry
    ports:
      - "8800:8800"
    environment:
      LOCUS_REGISTRY: "registry:5000"
      LOCUS_NAMESPACE: "library"
      LOCUS_INSECURE: "1"
      # Bind to all interfaces so the proxy/tunnel can reach it.
      LOCUS_HUB_HOST: "0.0.0.0"
    command: >
      bash -c "pip install --no-cache-dir 'locus-etl[serve,oci]' &&
               locus hub --host 0.0.0.0 --port 8800 --no-seed"
    restart: unless-stopped

  # Route B: Cloudflare Tunnel — exposes the Hub publicly with no open ports / no VM IP.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: locus-tunnel
    profiles: ["tunnel"]
    depends_on:
      - hub-ui
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  locus-registry-data:
