# nginx reverse proxy: port 80 -> Locus Hub (127.0.0.1:8800)
# Installed to /etc/nginx/sites-available/locus-hub and symlinked into sites-enabled.
# Cloudflare terminates TLS and proxies to this origin on port 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name locus.dibyadarshankhanal.com.np _;

    # Reasonable upload size for future image push via the UI.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
