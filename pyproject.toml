[project]
name = "locus-engine"
version = "0.0.1"
description = "Locus Layer 1 — the processing engine: unstructured corpus to validated, source-grounded tabular data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dibae101" }]
keywords = ["etl", "rag", "provenance", "data-extraction", "grounding", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavier / scenario-specific extras are opt-in to keep the core lightweight.
docling = ["docling>=2.0"]
pdf = [
    "pdfplumber>=0.11",
]
ocr = ["rapidocr-onnxruntime>=1.3"]
html = ["trafilatura>=1.8", "selectolax>=0.3"]
dedup = ["rapidfuzz>=3.0"]
embeddings = ["fastembed>=0.3"]
llm = ["litellm>=1.40", "instructor>=1.3"]
normalize = ["python-dateutil>=2.9", "babel>=2.14", "phonenumbers>=8.13"]
sql = ["sqlalchemy>=2.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
docker = ["docker>=7.0"]

[project.scripts]
locus = "locus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus_engine", "src/locus"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/locus_engine", "src/locus"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "keyring", "instructor"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/locus_engine"]

[tool.coverage.report]
fail_under = 85
show_missing = true
